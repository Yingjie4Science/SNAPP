name: Validate national artifacts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install lightweight validation dependencies
        run: python -m pip install --requirement requirements-ci.txt

      - name: Run smoke and committed-artifact tests
        run: pytest -q

      - name: Re-run fail-closed national QA
        run: python src/national/qa_national_results.py --check-only
